<!DOCTYPE html>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='project_page_style.css'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <head>
        <div class="git_head">
            <div class="head_first">
                <button class="head_nav cursor_on fa-mosaic fa-solid fa-bars"></button>
                <img class="git_logo" src="img/git_logo.png" alt="git_logo"/>
            </div>
            <div class="head_second">
                <span class="head_title">Projects</span>
                <button class="search_btn cursor_on">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>Type / to search</span>
                </button>
            </div>
            <div class="head_third">
                <div class="buttons">
                    <div class="copilot">
                        <div class="copilot_icon cursor_on"></div>
                        <div class="copilot_arrow cursor_on">
                            <i class="fa-solid fa-caret-down"></i>
                        </div>
                    </div>
                    <div class="line"></div>
                    <div class="action_menu btn_box cursor_on">
                        <i class="fa-solid fa-plus"></i>
                        &nbsp;
                        <i class="fa-solid fa-caret-down"></i>
                    </div>
                    <div class="path btn_box cursor_on">
                        <i class="fa-regular fa-circle-dot"></i>
                    </div>
                    <div class="req btn_box cursor_on">
                        <i class="fa-solid fa-code-pull-request"></i>
                    </div>
                    <div class="repo btn_box cursor_on">
                        <i class="fa-solid fa-book-bookmark"></i>
                    </div>
                    <div class="user_menu">

                    </div>
                </div>
            </div>
        </div>
    </head>
    <main>
        <div class="main_wrap">
            <div class="left_wrap">
                <ul class="left_menu">
                    <li class="activate">
                        <i class="fa-regular fa-clock"></i>
                        <span>Recently viewed</span>
                    </li>
                    <li>
                        <i class="fa-regular fa-user"></i>
                        <span> Created by me</span>
                    </li>
                </ul>
            </div>
            <div class="right_wrap">
                <h2>Recently viewed</h2>
                <form id="search_form">
                    <div class="view_search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input class="search_input" type="text" name="search_input" value="is:open"/>
                        <i class="fl fa-solid fa-circle-xmark"></i>
                    </div>
                </form>
                <div class="project_table">
                    <div class="table_head">
                        <span>1 recently viewd</span>
                    </div>
                    <div class="table_body">
                        <div class="body_left">
                            <div class="tb_title">
                                <i class="fa-solid fa-film"></i>
                                <span class="project_title">@qwwe132's untitled project</span>
                                <span class="project_type">private</span>
                            </div>
                            <div class="author">

                            </div>
                        </div>  
                        <div class="body_right">
                            <button class="more_info">
                                <i class="fa-solid fa-ellipsis"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
