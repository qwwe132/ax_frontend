<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pull requests</title>
    <link rel="stylesheet" href=",,,,,">
    <link rel="stylesheet" href="....">
</head>
<body>
    <header>
        <div class="git_head">
            <div class="head_first"></div>
            <div class="head_second"></div>
            <div class="head_third"></div>
        </div>
    </header>
    <main>
        <div>
            <div class="inbox">
                <header>
                    <div class="inbox_header">
                        <div class="inbox_title"></div>
                        <div class ="inbox_gap"></div>

                        <button></button>
                    </div>
                </header>
                <div class="inbox_plain">
                    <div class="content_area">
                        <div class="publish_box">
                            <button></button>
                            <h2>Needs your review</h2>
                        </div>
                        <div class="publish_box">
                            <button></button>
                            <h2>Needs your teams' review</h2>
                        </div>
                        <div class="publish_box">
                            <button></button>
                            <h2>Your drafts</h2>
                            <button></button>
                        </div>
                        <div class="publish_box">
                            <button></button>
                            <h2>Waiting for review or checks</h2>
                            <button></button>
                        </div>
                        <div class="publish_box">
                            <button></button>
                            <h2>Needs action</h2>
                            <button></button>
                        </div>
                        <div class="publish_box">
                            <button></button>
                            <h2>Ready to merge</h2>
                            <button></button>
                        </div>
                    </div>
                </div>
            </div>


            <div class="sidebar">
                <div class="sidebar_menu_buttons"></div>
                <hr>
                <div class="sidebar_views"></div>
                <div class="sidebar_margin_collapse"></div>
            </div>

        </div>
    </main>
    <footer>
        <div>

        </div>
    </footer>
</body>
</html>
