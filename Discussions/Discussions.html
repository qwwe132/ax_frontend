<!DOCTYPE html>
<html lang="en" data-color-mode="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discussions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <header>
        
           
        <div class="git_head">
            <div class="head_first">
                <div class="git_logo">
                    <button class="head_nav cursor_on fa-mosaic fa-solid fa-bars"></button>
                    <i class="fa-brands fa-github" class="git"></i>
                    <span class="styles-module__contextCrumbLast__tI2e3"></span>

                    <strong>Discussions</strong>
                </div>
            </div> 
                     
    
    
        
                  
                
            <div class="head_third">
                
                <div class="top-search">
                    <i class="fa-solid fa-magnifying-glass"></i>  Type / to search
                      
                </div>
                
                <div class="icon-box">
                    <img src="images/copilot-brands-solid.png" class="copliot">
                    <i class="fa-solid fa-caret-down"></i>
                </div>
                <div class="divider"></div>
                <div class="icon-box2">
                    <i class="fa-solid fa-plus"></i>
                    &nbsp;
                    <i class="fa-solid fa-caret-down"></i>
                </div>
                <div class="icon-box3">
                    <i class="fa-regular fa-circle-dot"></i>
                </div>
                <div class="icon-box4">
                    <i class="fa-solid fa-code-compare"></i>
                </div>
                <div class="icon-box5">
                    <i class="fa-solid fa-book-bookmark"></i>
                </div>
                <div class="icon-box6">
                    <i class="fa-solid fa-inbox"></i>
                </div>
                <div class="user_menu">
                    <!--<img src="images/312277608.png"> -->
                </div>
            </div>    
            
                 
        </div>
    </header>
    <main>

        <div class="content">
            <div class="filter-row">
                <div class="tabs">
                    <button class="active">Created</button>
                    <button>Commented</button>
                </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i> author:imeab
            
            </div>
            
        </div>
        <section class="empty-box">
                <div class="talk-icon"></div>
                <i class="fa-solid fa-comments"></i>
                <h3>No discussions match the selected filters.</h3>
                <p>Discussions are used to ask questions and have open-ended conversations.</p>
        </section>
    

        <footer>
            
               
            <div class="footer-menu">
                <i class="fa-brands fa-github"></i>
                <span>© 2026 GitHub, Inc.</span>
                <a href="javascript:void(0)">Terms</a>
                <a href="javascript:void(0)">Privacy</a>
                <a href="javascript:void(0)">Security</a>
                <a href="javascript:void(0)">Status</a>
                <a href="javascript:void(0)">Community</a>
                <a href="javascript:void(0)">Docs</a>
                <a href="javascript:void(0)">Contact</a>
                <a href="javascript:void(0)">Manage cookies</a>
                <a href="javascript:void(0)">Do not share my personal information</a>
            </div>


        </footer>
    </main>
    
</body>
</html>
